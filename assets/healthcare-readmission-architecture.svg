<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Healthcare readmission analytics architecture in Microsoft Fabric</title>
  <desc id="description">A left-to-right architecture showing synthetic healthcare data flowing through OneLake, Spark engineering, machine learning and MLflow, batch inference, and Power BI and Fabric Data Agent consumption. A separate AI Functions path processes unstructured text.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #475569; }
      .stage { font: 700 14px 'Segoe UI', sans-serif; fill: #334155; letter-spacing: 1.2px; }
      .node-title { font: 700 16px 'Segoe UI', sans-serif; fill: #0F172A; }
      .node-copy { font: 400 13px 'Segoe UI', sans-serif; fill: #475569; }
      .small { font: 600 12px 'Segoe UI', sans-serif; fill: #334155; }
      .pill { font: 700 11px 'Segoe UI', sans-serif; fill: #334155; letter-spacing: 0.5px; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .primary-arrow { fill: none; stroke: #0078D4; stroke-width: 4; marker-end: url(#arrowBlue); }
      .optional-arrow { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="40" y="32" width="1360" height="836" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>

  <text x="80" y="82" class="title">30-Day Hospital Readmission Analytics</text>
  <text x="80" y="111" class="subtitle">One governed data foundation powering data engineering, machine learning, AI, and business action in Microsoft Fabric</text>
  <rect x="1180" y="57" width="176" height="38" rx="19" fill="#E8F3FF" stroke="#0078D4"/>
  <text x="1268" y="81" text-anchor="middle" class="pill">MICROSOFT FABRIC</text>

  <!-- Stage headings -->
  <text x="84" y="172" class="stage">01  DATA FOUNDATION</text>
  <text x="372" y="172" class="stage">02  ENGINEERING</text>
  <text x="660" y="172" class="stage">03  MODEL FACTORY</text>
  <text x="948" y="172" class="stage">04  INFERENCE</text>
  <text x="1236" y="172" class="stage">05  CONSUMPTION</text>

  <!-- Main pipeline cards -->
  <g filter="url(#shadow)">
    <rect x="76" y="194" width="228" height="278" rx="12" fill="#FFF9E8" stroke="#D59B00" stroke-width="2"/>
    <rect x="364" y="194" width="228" height="278" rx="12" fill="#EAF7EA" stroke="#107C10" stroke-width="2"/>
    <rect x="652" y="194" width="228" height="278" rx="12" fill="#F2EBFA" stroke="#5C2D91" stroke-width="2"/>
    <rect x="940" y="194" width="228" height="278" rx="12" fill="#E8F3FF" stroke="#0078D4" stroke-width="2"/>
    <rect x="1228" y="194" width="152" height="278" rx="12" fill="#FDECEE" stroke="#C42B1C" stroke-width="2"/>
  </g>

  <!-- Data foundation -->
  <circle cx="190" cy="242" r="25" fill="#D59B00"/>
  <path d="M178 241h24M181 233h18M184 225h12M181 249h18M184 257h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="190" y="291" text-anchor="middle" class="node-title">Synthetic encounters</text>
  <text x="190" y="314" text-anchor="middle" class="node-copy">5,000 reproducible records</text>
  <path d="M190 332v22" class="arrow"/>
  <ellipse cx="190" cy="373" rx="72" ry="14" fill="#FFFFFF" stroke="#A66F00" stroke-width="2"/>
  <path d="M118 373v42c0 8 32 14 72 14s72-6 72-14v-42" fill="#FFFFFF" stroke="#A66F00" stroke-width="2"/>
  <path d="M118 394c0 8 32 14 72 14s72-6 72-14" fill="none" stroke="#A66F00"/>
  <text x="190" y="392" text-anchor="middle" class="small">OneLake</text>
  <text x="190" y="414" text-anchor="middle" class="node-copy">Raw Parquet</text>

  <!-- Engineering -->
  <rect x="396" y="220" width="164" height="58" rx="8" fill="#FFFFFF" stroke="#107C10"/>
  <text x="478" y="244" text-anchor="middle" class="node-title">Bronze Delta</text>
  <text x="478" y="264" text-anchor="middle" class="node-copy">Raw governed table</text>
  <path d="M478 278v30" class="arrow"/>
  <rect x="396" y="308" width="164" height="68" rx="8" fill="#FFFFFF" stroke="#107C10"/>
  <text x="478" y="334" text-anchor="middle" class="node-title">Spark + Wrangler</text>
  <text x="478" y="355" text-anchor="middle" class="node-copy">Profile, clean, validate</text>
  <path d="M478 376v30" class="arrow"/>
  <rect x="396" y="406" width="164" height="44" rx="22" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="478" y="433" text-anchor="middle" class="node-title">Silver Delta</text>

  <!-- Model factory -->
  <rect x="680" y="216" width="172" height="54" rx="8" fill="#FFFFFF" stroke="#5C2D91"/>
  <text x="766" y="239" text-anchor="middle" class="node-title">Feature pipeline</text>
  <text x="766" y="259" text-anchor="middle" class="node-copy">Encode, impute, scale</text>
  <path d="M766 270v27" class="arrow"/>
  <rect x="676" y="297" width="54" height="70" rx="8" fill="#FFFFFF" stroke="#5C2D91"/>
  <rect x="739" y="297" width="54" height="70" rx="8" fill="#FFFFFF" stroke="#5C2D91"/>
  <rect x="802" y="297" width="54" height="70" rx="8" fill="#FFFFFF" stroke="#5C2D91"/>
  <text x="703" y="326" text-anchor="middle" class="small">Logistic</text>
  <text x="703" y="344" text-anchor="middle" class="small">Regression</text>
  <text x="766" y="326" text-anchor="middle" class="small">Random</text>
  <text x="766" y="344" text-anchor="middle" class="small">Forest</text>
  <text x="829" y="337" text-anchor="middle" class="small">XGBoost</text>
  <path d="M703 367v17h126v-17M766 384v17" fill="none" stroke="#475569" stroke-width="2"/>
  <rect x="680" y="401" width="172" height="49" rx="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="766" y="421" text-anchor="middle" class="node-title">MLflow registry</text>
  <text x="766" y="440" text-anchor="middle" class="node-copy">Baseline + tuned models</text>

  <!-- Inference -->
  <rect x="968" y="216" width="172" height="56" rx="8" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="1054" y="240" text-anchor="middle" class="node-title">Best tuned model</text>
  <text x="1054" y="260" text-anchor="middle" class="node-copy">Selected by ROC AUC</text>
  <path d="M1054 272v28" class="arrow"/>
  <rect x="968" y="300" width="172" height="48" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="1054" y="330" text-anchor="middle" class="node-title">Batch scoring</text>
  <path d="M1054 348v25" class="arrow"/>
  <rect x="956" y="373" width="60" height="61" rx="7" fill="#FFFFFF" stroke="#0078D4"/>
  <rect x="1024" y="373" width="60" height="61" rx="7" fill="#FFFFFF" stroke="#0078D4"/>
  <rect x="1092" y="373" width="60" height="61" rx="7" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="986" y="399" text-anchor="middle" class="small">Predic-</text>
  <text x="986" y="416" text-anchor="middle" class="small">tions</text>
  <text x="1054" y="408" text-anchor="middle" class="small">Summary</text>
  <text x="1122" y="399" text-anchor="middle" class="small">Report-</text>
  <text x="1122" y="416" text-anchor="middle" class="small">ing</text>
  <path d="M1140 244h40v-20h24" class="optional-arrow"/>
  <text x="1190" y="215" text-anchor="middle" class="pill">OPTIONAL API</text>

  <!-- Consumption -->
  <rect x="1246" y="216" width="116" height="55" rx="8" fill="#FFFFFF" stroke="#C42B1C"/>
  <text x="1304" y="239" text-anchor="middle" class="node-title">Direct Lake</text>
  <text x="1304" y="258" text-anchor="middle" class="node-copy">Semantic model</text>
  <path d="M1304 271v23" class="arrow"/>
  <rect x="1246" y="294" width="116" height="52" rx="8" fill="#FFFFFF" stroke="#C42B1C"/>
  <text x="1304" y="326" text-anchor="middle" class="node-title">Power BI</text>
  <rect x="1246" y="366" width="116" height="52" rx="8" fill="#FFFFFF" stroke="#C42B1C"/>
  <text x="1304" y="388" text-anchor="middle" class="node-title">Data Agent</text>
  <text x="1304" y="407" text-anchor="middle" class="node-copy">Grounded Q&amp;A</text>
  <path d="M1304 418v18" class="arrow"/>
  <rect x="1246" y="436" width="116" height="24" rx="12" fill="#FDE7E9" stroke="#C42B1C"/>
  <text x="1304" y="452" text-anchor="middle" class="pill">HUMAN REVIEW</text>

  <!-- Primary cross-stage flow -->
  <path d="M304 333h60" class="primary-arrow"/>
  <path d="M592 333h60" class="primary-arrow"/>
  <path d="M880 333h60" class="primary-arrow"/>
  <path d="M1168 333h60" class="primary-arrow"/>

  <!-- AI Functions lane -->
  <rect x="76" y="532" width="1304" height="196" rx="14" fill="#FFF9E8" stroke="#F7630C" stroke-width="2"/>
  <rect x="98" y="551" width="158" height="30" rx="15" fill="#FFF4CE" stroke="#F7630C"/>
  <text x="177" y="571" text-anchor="middle" class="pill">FABRIC AI FUNCTIONS</text>
  <text x="98" y="608" class="node-title">Unstructured healthcare text</text>
  <text x="98" y="632" class="node-copy">Distributed LLM-powered transformations in Spark, with no external API key</text>

  <rect x="98" y="660" width="185" height="46" rx="8" fill="#FFFFFF" stroke="#F7630C"/>
  <rect x="319" y="660" width="185" height="46" rx="8" fill="#FFFFFF" stroke="#F7630C"/>
  <rect x="540" y="660" width="185" height="46" rx="8" fill="#FFFFFF" stroke="#F7630C"/>
  <text x="190" y="689" text-anchor="middle" class="node-title">Patient feedback</text>
  <text x="411" y="689" text-anchor="middle" class="node-title">Discharge notes</text>
  <text x="632" y="689" text-anchor="middle" class="node-title">Patient inquiries</text>

  <path d="M283 683h40" class="arrow"/>
  <path d="M504 683h40" class="arrow"/>
  <path d="M725 683h59" class="arrow"/>
  <rect x="784" y="645" width="214" height="76" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="891" y="675" text-anchor="middle" class="node-title">Analyze and structure</text>
  <text x="891" y="698" text-anchor="middle" class="node-copy">Sentiment | Extract | Classify</text>
  <path d="M998 683h74" class="primary-arrow"/>
  <rect x="1072" y="645" width="278" height="76" rx="10" fill="#FDE7E9" stroke="#C42B1C" stroke-width="2"/>
  <text x="1211" y="675" text-anchor="middle" class="node-title">Prioritized follow-up</text>
  <text x="1211" y="698" text-anchor="middle" class="node-copy">Care-management workflow + human review</text>

  <!-- Governance foundation -->
  <rect x="76" y="770" width="1304" height="62" rx="12" fill="#F1F5F9" stroke="#64748B"/>
  <text x="102" y="797" class="node-title">Governance foundation</text>
  <text x="102" y="818" class="node-copy">OneLake data lineage</text>
  <circle cx="388" cy="801" r="4" fill="#64748B"/>
  <text x="408" y="806" class="small">Delta tables</text>
  <circle cx="550" cy="801" r="4" fill="#64748B"/>
  <text x="570" y="806" class="small">MLflow tracking</text>
  <circle cx="754" cy="801" r="4" fill="#64748B"/>
  <text x="774" y="806" class="small">Workspace permissions</text>
  <circle cx="1010" cy="801" r="4" fill="#64748B"/>
  <text x="1030" y="806" class="small">Synthetic data only</text>
  <circle cx="1228" cy="801" r="4" fill="#64748B"/>
  <text x="1248" y="806" class="small">No PHI</text>
</svg>
